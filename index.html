<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘의 클로드 인기글 TOP5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1117; --surface:#171A24; --surface2:#1F2330;
    --text:#F5F3EC; --muted:#8B90A0; --line: rgba(245,243,236,0.08);
    --lime:#D4FF3F; --violet:#9B8CFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px 60px;}
  .top{width:100%;max-width:460px;text-align:center;margin-bottom:22px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;color:var(--lime);
    text-transform:uppercase;margin-bottom:8px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;line-height:1.3;margin:0 0 6px;}
  .sub{color:var(--muted);font-size:13px;line-height:1.5;}
  .stage{position:relative;width:100%;max-width:460px;aspect-ratio:1/1;}
  .card{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:28px;display:flex;flex-direction:column;opacity:0;transform:translateX(24px);
    transition:opacity .35s ease, transform .35s ease;pointer-events:none;overflow:hidden;}
  .card.active{opacity:1;transform:translateX(0);pointer-events:auto;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--lime),var(--violet));opacity:.7;}
  .rank-row{display:flex;justify-content:space-between;align-items:flex-start;}
  .rank{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:56px;line-height:1;color:var(--text);}
  .rank sup{font-size:16px;color:var(--muted);font-weight:500;margin-left:2px;}
  .badge{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;background:rgba(212,255,63,0.12);
    color:var(--lime);border:1px solid rgba(212,255,63,0.35);padding:5px 9px;border-radius:100px;
    white-space:nowrap;margin-top:6px;}
  .signal{margin-top:14px;height:6px;width:100%;background:var(--surface2);border-radius:100px;overflow:hidden;}
  .signal-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--lime));border-radius:100px;
    transition:width .6s ease;}
  .signal-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-top:6px;}
  .headline{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;line-height:1.32;margin-top:20px;}
  .why{color:var(--muted);font-size:14px;line-height:1.55;margin-top:12px;flex:1;}
  .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);
    padding-top:14px;margin-top:12px;}
  .source{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--violet);}
  .dots{display:flex;gap:6px;}
  .dot{width:6px;height:6px;border-radius:100%;background:var(--line);transition:background .2s, width .2s;}
  .dot.on{background:var(--lime);width:16px;border-radius:100px;}
  .nav{display:flex;justify-content:space-between;width:100%;max-width:460px;margin-top:16px;}
  .arrow{background:var(--surface);border:1px solid var(--line);color:var(--text);width:44px;height:44px;
    border-radius:100%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s;}
  .arrow:hover{background:var(--surface2);}
  .arrow:disabled{opacity:.3;cursor:default;}
  .dots-wrap{display:flex;align-items:center;gap:6px;}
  .controls{width:100%;max-width:460px;margin-top:28px;display:flex;flex-direction:column;gap:10px;}
  .meta-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);
    font-family:'JetBrains Mono',monospace;}
  .caption-toggle{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:12px;
    padding:10px;border-radius:12px;cursor:pointer;font-family:'Inter',sans-serif;}
  .caption-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;
    font-size:13px;line-height:1.7;white-space:pre-wrap;display:none;}
  .caption-box.show{display:block;}
  .copy-btn{margin-top:10px;background:var(--surface2);color:var(--text);border:1px solid var(--line);
    padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;}
</style>
</head>
<body>

  <div class="top">
    <div class="eyebrow">Daily Claude Buzz Radar</div>
    <h1>오늘, 클로드에 대해<br/>가장 많이 찾아본 이슈</h1>
    <p class="sub" id="dateLabel">인스타 캐러셀용</p>
  </div>

  <div id="stageWrap"></div>

  <div class="controls">
    <div class="meta-row">
      <span id="updatedAt">-</span>
      <span id="itemCount">4건 · 웹 검색 기반</span>
    </div>
    <button class="caption-toggle" id="captionToggle">인스타 캡션용 텍스트로 보기</button>
    <div class="caption-box" id="captionBox">
      <div id="captionText"></div>
      <button class="copy-btn" id="copyBtn">복사하기</button>
    </div>
  </div>

<script>
// 2026.09.19
const generatedAt = "2026.09.20";
const items = [{"title": "\"2조달러 IPO 또 미뤄졌다\"…앤트로픽, 11월로 한 달 연기하고 3분기 실적 들고 재도전", "summary": "앤트로픽이 애초 10월로 점쳐졌던 기업공개(IPO) 시점을 11월로 한 달 늦췄어요. 3분기 실적을 투자자에게 먼저 보여줄 시간을 벌기 위한 결정으로, 몸값은 2조달러(약 2776조원)에 달할 전망이라 \"다음 상장 대어\"를 향한 관심이 다시 뜨거워지고 있어요.", "tag": "HOT ISSUE", "buzz": 76, "source": "디지털데일리·ZDNet Korea (2026.09.19)"}, {"title": "\"내 클로드는 문란해\"…뉴욕 한복판 뒤덮은 파격 옥외광고에 시선 집중", "summary": "AI 에이전트 관리 스타트업 '머지'가 클로드를 성적으로 암시하는 파격 이미지의 옥외광고를 뉴욕 도심에 내걸며 화제가 됐어요. \"MCP(모델 컨텍스트 프로토콜)를 풍자한 마케팅\"이라지만 SNS에서는 \"너무 갔다\"와 \"재치있다\"는 반응이 엇갈리며 클로드 이름이 계속 오르내리고 있어요.", "tag": "HOT ISSUE", "buzz": 58, "source": "SF Standard (2026.09.15)"}, {"title": "\"이제 소상공인도 AI 직원 하나 들인 셈\"…클로드, 업무 자동화 워크플로우 43개 무더기 추가", "summary": "앤트로픽이 쇼피파이·세일즈포스·스트라이프 등 27개 앱과 연동되는 43개 업무 워크플로우를 소상공인용 클로드에 추가했어요. 발송 전 사장님 승인을 거치는 '승인 모드'가 기본이라 소규모 사업자들 사이에서 \"직원 없이도 마케팅·회계까지 돌아간다\"는 반응이 나와요.", "tag": "NEW FEATURE", "buzz": 44, "source": "Anthropic 공식 블로그·Unite.AI (2026.09.15)"}, {"title": "\"슈왑 잔고까지 대신 조회한다\"…클로드, 금융 자문가 전용 AI 정식 출시", "summary": "앤트로픽이 찰스슈왑·블랙록 등과 연동되는 '클로드 포 파이낸셜 어드바이저'를 내놨어요. 고객 미팅 준비와 규정 준수 점검까지 자동화해 \"자문사 업무의 절반을 AI가 가져간다\"는 평가가 나와요.", "tag": "NEW FEATURE", "buzz": 34, "source": "AI타임스·Unite.AI (2026.09.14)"}];

let current = 0;
const stageWrap = document.getElementById('stageWrap');
document.getElementById('updatedAt').textContent = '생성: ' + generatedAt;
document.getElementById('dateLabel').textContent = generatedAt + ' 기준 실제 검색 결과';

function renderStage(){
  const dotsHtml = items.map((_,i)=>`<div class="dot ${i===current?'on':''}" data-i="${i}"></div>`).join('');
  const cardsHtml = items.map((it,i)=>`
    <div class="card ${i===current?'active':''}">
      <div class="rank-row">
        <div class="rank">${String(i+1).padStart(2,'0')}<sup>/ ${String(items.length).padStart(2,'0')}</sup></div>
        <div class="badge">${it.tag}</div>
      </div>
      <div class="signal"><div class="signal-fill" style="width:${it.buzz}%"></div></div>
      <div class="signal-label">관심도 ${it.buzz}%</div>
      <div class="headline">${it.title}</div>
      <div class="why">${it.summary}</div>
      <div class="foot"><span class="source">${it.source}</span></div>
    </div>
  `).join('');

  stageWrap.innerHTML = `
    <div class="stage">${cardsHtml}</div>
    <div class="nav">
      <button class="arrow" id="prevBtn" ${current===0?'disabled':''}>←</button>
      <div class="dots-wrap">${dotsHtml}</div>
      <button class="arrow" id="nextBtn" ${current===items.length-1?'disabled':''}>→</button>
    </div>
  `;
  document.getElementById('prevBtn').onclick = ()=>{ if(current>0){current--; renderStage();} };
  document.getElementById('nextBtn').onclick = ()=>{ if(current<items.length-1){current++; renderStage();} };
  stageWrap.querySelectorAll('.dot').forEach(d=>{
    d.onclick = ()=>{ current = parseInt(d.dataset.i); renderStage(); };
  });
  buildCaption();
}

function buildCaption(){
  const lines = items.map((it,i)=> `${i+1}. ${it.title}\n${it.summary}\n(출처: ${it.source})`).join('\n\n');
  document.getElementById('captionText').textContent = lines;
}

document.addEventListener('click', (e)=>{
  if(e.target && e.target.id === 'captionToggle'){
    document.getElementById('captionBox').classList.toggle('show');
  }
  if(e.target && e.target.id === 'copyBtn'){
    navigator.clipboard.writeText(document.getElementById('captionText').textContent);
    e.target.textContent = '복사됨!';
    setTimeout(()=> e.target.textContent = '복사하기', 1500);
  }
});

renderStage();
</script>
</body>
</html>
